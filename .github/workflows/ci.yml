name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

  goreleaser-check:
    name: GoReleaser Config Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run go vet
        run: go vet ./...

      - name: Build binary
        run: go build -v ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: github.event_name != 'pull_request'
        with:
          files: ./coverage.txt
          fail_ci_if_error: false

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test binary with platform structure
        run: |
          # Create platform directory structure matching dockers_v2 ($TARGETPLATFORM/)
          mkdir -p linux/amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o linux/amd64/aws-smtp-relay .

      - name: Build Distroless image (amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          tags: kamorion/aws-smtp-relay:test
          build-args: |
            TARGETPLATFORM=linux/amd64

      - name: Build Alpine image (amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.alpine
          platforms: linux/amd64
          push: false
          tags: kamorion/aws-smtp-relay:test-alpine
          build-args: |
            TARGETPLATFORM=linux/amd64

  helm:
    name: Helm Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint --strict helm/aws-smtp-relay

      - name: Render chart
        run: |
          set -euo pipefail
          chart=helm/aws-smtp-relay
          # Default values
          helm template smtp "$chart" > /dev/null
          # EKS example
          helm template smtp "$chart" -f "$chart/examples/values-eks-pod-identity.yaml" > /dev/null
          # TLS, inline auth, ServiceMonitor, HPA, hard anti-affinity
          helm template smtp "$chart" \
            --set config.user=relay,config.bcryptHash=hash,config.password=pass \
            --set config.tls.enabled=true,config.tls.cert=cert,config.tls.key=key,config.tls.keyPassphrase=pass \
            --set metrics.serviceMonitor.enabled=true,autoscaling.enabled=true \
            --set podAntiAffinityPreset=hard > /dev/null
          # No metrics: TCP probes
          out=$(helm template smtp "$chart" --set metrics.enabled=false,podDisruptionBudget.enabled=false,podAntiAffinityPreset=)
          grep -q 'tcpSocket' <<<"$out"
          if grep -q 'METRICS_ADDRESS' <<<"$out"; then exit 1; fi
          # TLS without a certificate must fail
          if helm template smtp "$chart" --set config.tls.enabled=true > /dev/null 2>&1; then exit 1; fi
