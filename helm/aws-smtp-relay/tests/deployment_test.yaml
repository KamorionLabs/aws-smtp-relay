suite: aws-smtp-relay deployment tests
templates:
  - templates/deployment.yaml
  - templates/configmap.yaml
tests:
  #############################################################################
  # BASIC DEPLOYMENT
  #############################################################################
  - it: should create a Deployment
    template: templates/deployment.yaml
    set:
      fullnameOverride: smtp-relay
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: smtp-relay

  - it: should use correct image
    template: templates/deployment.yaml
    set:
      image:
        repository: ghcr.io/kamorionlabs/aws-smtp-relay
        tag: "1.0.0"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/kamorionlabs/aws-smtp-relay:1.0.0"

  #############################################################################
  # REPLICAS AND AUTOSCALING
  #############################################################################
  - it: should set replicas when autoscaling disabled
    template: templates/deployment.yaml
    set:
      replicaCount: 3
      autoscaling:
        enabled: false
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: should not set replicas when autoscaling enabled
    template: templates/deployment.yaml
    set:
      autoscaling:
        enabled: true
    asserts:
      - notExists:
          path: spec.replicas

  #############################################################################
  # PORTS
  #############################################################################
  - it: should expose SMTP port 1025
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: smtp
            containerPort: 1025
            protocol: TCP

  #############################################################################
  # CONFIGMAP REFERENCE
  #############################################################################
  - it: should reference configmap in envFrom
    template: templates/deployment.yaml
    set:
      fullnameOverride: smtp-relay
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: smtp-relay

  #############################################################################
  # AUTHENTICATION
  #############################################################################
  - it: should set USER env when config.user is defined
    template: templates/deployment.yaml
    set:
      config:
        user: smtp-user
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: USER
            value: "smtp-user"

  - it: should set PASSWORD from secret when config.password is defined
    template: templates/deployment.yaml
    set:
      fullnameOverride: smtp-relay
      config:
        password: secret-password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PASSWORD
            valueFrom:
              secretKeyRef:
                name: smtp-relay
                key: password

  - it: should set BCRYPT_HASH from secret when config.bcryptHash is defined
    template: templates/deployment.yaml
    set:
      fullnameOverride: smtp-relay
      config:
        bcryptHash: "$2a$10$somehashedvalue"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BCRYPT_HASH
            valueFrom:
              secretKeyRef:
                name: smtp-relay
                key: bcrypt-hash

  #############################################################################
  # TLS CONFIGURATION
  #############################################################################
  - it: should mount TLS volume when config.tls.enabled=true
    template: templates/deployment.yaml
    set:
      fullnameOverride: smtp-relay
      config:
        tls:
          enabled: true
          cert: "cert-content"
          key: "key-content"
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tls
            secret:
              secretName: smtp-relay-tls

  - it: should set TLS env vars when config.tls.enabled=true
    template: templates/deployment.yaml
    set:
      config:
        tls:
          enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TLS_CERT
            value: /etc/tls/tls.crt
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TLS_KEY
            value: /etc/tls/tls.key

  - it: should NOT mount TLS volume when config.tls.enabled=false
    template: templates/deployment.yaml
    set:
      config:
        tls:
          enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.volumes

  #############################################################################
  # HEALTH CHECKS
  #############################################################################
  - it: should configure livenessProbe when enabled
    template: templates/deployment.yaml
    set:
      livenessProbe:
        enabled: true
        tcpSocket:
          port: smtp
        initialDelaySeconds: 10
        periodSeconds: 10
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: smtp
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 10

  - it: should configure readinessProbe when enabled
    template: templates/deployment.yaml
    set:
      readinessProbe:
        enabled: true
        tcpSocket:
          port: smtp
        initialDelaySeconds: 5
        periodSeconds: 5
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.tcpSocket.port
          value: smtp
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
          value: 5

  #############################################################################
  # SECURITY CONTEXT
  #############################################################################
  - it: should apply podSecurityContext
    template: templates/deployment.yaml
    set:
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000

  - it: should apply container securityContext
    template: templates/deployment.yaml
    set:
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  #############################################################################
  # NODE SELECTOR AND TOLERATIONS
  #############################################################################
  - it: should apply nodeSelector when configured
    template: templates/deployment.yaml
    set:
      nodeSelector:
        service: smtp
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector.service
          value: smtp

  - it: should apply tolerations when configured
    template: templates/deployment.yaml
    set:
      tolerations:
        - key: dedicated
          operator: Equal
          value: smtp
          effect: NoSchedule
    asserts:
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: dedicated
            operator: Equal
            value: smtp
            effect: NoSchedule

  - it: should apply affinity when configured
    template: templates/deployment.yaml
    set:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
    asserts:
      - exists:
          path: spec.template.spec.affinity.podAntiAffinity

  #############################################################################
  # RESOURCES
  #############################################################################
  - it: should apply resource limits and requests
    template: templates/deployment.yaml
    set:
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 500m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 128Mi
