apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aws-smtp-relay.fullname" . }}
  labels:
    {{- include "aws-smtp-relay.labels" . | nindent 4 }}
data:
  LISTEN_ADDRESS: {{ printf ":%v" .Values.config.port | quote }}
  SMTP_SERVICE_NAME: {{ .Values.config.name | quote }}
  RELAY_API: {{ .Values.config.relayAPI | quote }}
  {{- with .Values.config.hostname }}
  HOSTNAME: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.awsRegion }}
  AWS_REGION: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.setName }}
  SES_CONFIGURATION_SET_NAME: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.sourceArn }}
  SES_SOURCE_ARN: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.fromArn }}
  SES_FROM_ARN: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.returnPathArn }}
  SES_RETURN_PATH_ARN: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.user }}
  AUTH_USERNAME: {{ . | quote }}
  {{- end }}
  {{- if .Values.config.enableLogin }}
  ENABLE_LOGIN: "true"
  {{- end }}
  {{- with .Values.config.ips }}
  ALLOWED_IPS: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.allowFrom }}
  ALLOWED_SENDERS_REGEX: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.denyTo }}
  DENIED_RECIPIENTS_REGEX: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.allowTo }}
  ALLOWED_RECIPIENTS_REGEX: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.allowToDomains }}
  ALLOWED_RECIPIENT_DOMAINS: {{ . | quote }}
  {{- end }}
  {{- if .Values.config.tls.enabled }}
  CERT_FILE: /etc/tls/tls.crt
  KEY_FILE: /etc/tls/tls.key
  REQUIRE_STARTTLS: {{ .Values.config.tls.requireStartTLS | toString | quote }}
  REQUIRE_TLS: {{ .Values.config.tls.onlyTLS | toString | quote }}
  {{- end }}
  {{- if .Values.metrics.enabled }}
  METRICS_ADDRESS: {{ printf ":%v" .Values.metrics.port | quote }}
  {{- end }}
