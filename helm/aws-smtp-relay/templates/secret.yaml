{{- if and (not .Values.config.existingSecret) (or .Values.config.password .Values.config.bcryptHash) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aws-smtp-relay.fullname" . }}
  labels:
    {{- include "aws-smtp-relay.labels" . | nindent 4 }}
type: Opaque
data:
  {{- with .Values.config.password }}
  password: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.config.bcryptHash }}
  bcrypt-hash: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.config.tls.enabled (not .Values.config.tls.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aws-smtp-relay.fullname" . }}-tls
  labels:
    {{- include "aws-smtp-relay.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ required "config.tls.cert is required when config.tls.enabled is true and config.tls.existingSecret is empty" .Values.config.tls.cert | b64enc | quote }}
  tls.key: {{ required "config.tls.key is required when config.tls.enabled is true and config.tls.existingSecret is empty" .Values.config.tls.key | b64enc | quote }}
{{- end }}
{{- if .Values.config.tls.keyPassphrase }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aws-smtp-relay.fullname" . }}-tls-pass
  labels:
    {{- include "aws-smtp-relay.labels" . | nindent 4 }}
type: Opaque
data:
  tls-key-passphrase: {{ .Values.config.tls.keyPassphrase | b64enc | quote }}
{{- end }}
